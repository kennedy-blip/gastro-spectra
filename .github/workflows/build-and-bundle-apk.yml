name: Build & Bundle GASTRO-SPECTRA APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'static/releases/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Build static SPA assets for Capacitor
        run: npm run build:apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK (preinstalled on the runner)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found at $SDK_ROOT"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            ls -R "$SDK_ROOT/cmdline-tools" 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          "$SDKMANAGER" --list_installed | head -20

      - name: Preserve native Capacitor plugins
        run: |
          mkdir -p /tmp/gastro-plugins
          cp -r android/app/src/main/java/com/gastrospectra/plugins /tmp/gastro-plugins/ 2>/dev/null || true
          ls -R /tmp/gastro-plugins || true

      - name: Generate Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Restore plugins & wire native bridge
        run: |
          mkdir -p android/app/src/main/java/com/gastrospectra/plugins
          cp -r /tmp/gastro-plugins/plugins/. android/app/src/main/java/com/gastrospectra/plugins/ 2>/dev/null || true
          ls -R android/app/src/main/java/com/gastrospectra/plugins
          python3 scripts/patch-android-bridge.py

      - name: Verify the packaged web bundle
        run: |
          set -euo pipefail
          test -f build-apk/index.html
          grep -q 'favicon.svg' build-apk/index.html
          for f in favicon.svg favicon.ico site.webmanifest robots.txt; do
            test -f "build-apk/$f" || { echo "::error::build-apk/$f missing"; exit 1; }
            test -f "android/app/src/main/assets/public/$f" || { echo "::error::assets/public/$f missing after cap sync"; exit 1; }
          done
          echo "web bundle verified: $(find android/app/src/main/assets/public -type f | wc -l) assets copied by cap sync"

      - name: Gradle build (debug-signed installable APK)
        working-directory: android
        run: |
          chmod +x gradlew || true
          if ./gradlew assembleDebug --no-daemon --stacktrace; then
            echo "APK built with both native Kotlin plugins"
          else
            echo "::warning::Native plugin build failed - retrying as a web-only APK"
            python3 ../scripts/web-only-android.py
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Stage APK artifact with checksum
        run: |
          mkdir -p static/releases
          APK=$(find android -type f -name "*.apk" | sort | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          echo "Using $APK"
          cp "$APK" static/releases/gastro-spectra-v29.0.0.apk
          sha256sum static/releases/gastro-spectra-v29.0.0.apk | tee static/releases/gastro-spectra-v29.0.0.apk.sha256
          unzip -l static/releases/gastro-spectra-v29.0.0.apk | grep -q "assets/public/index.html" \
            || { echo "::error::APK is missing assets/public/index.html"; exit 1; }
          unzip -l static/releases/gastro-spectra-v29.0.0.apk | grep -q "assets/public/favicon.svg" \
            || { echo "::error::APK is missing assets/public/favicon.svg (stale web bundle)"; exit 1; }
          APK_SHA=$(cut -d' ' -f1 static/releases/gastro-spectra-v29.0.0.apk.sha256)
          APK_BYTES=$(stat -c%s static/releases/gastro-spectra-v29.0.0.apk)
          cat > static/releases/build-info.json <<JSON
          {
            "app": "GASTRO-SPECTRA",
            "version": "29.0.0-polyglot",
            "packageId": "com.gastrospectra.clinical",
            "commit": "$(git rev-parse --short HEAD)",
            "runId": "${GITHUB_RUN_ID}",
            "apk": "gastro-spectra-v29.0.0.apk",
            "bytes": ${APK_BYTES},
            "sha256": "${APK_SHA}",
            "assets": $(find android/app/src/main/assets/public -type f | wc -l),
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat static/releases/build-info.json
          ls -lh static/releases/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gastro-spectra-apk
          path: |
            static/releases/gastro-spectra-v29.0.0.apk
            static/releases/gastro-spectra-v29.0.0.apk.sha256
          retention-days: 30

      - name: Commit APK into releases folder
        run: |
          git config user.name "gastro-spectra-ci"
          git config user.email "ci@gastro-spectra.local"
          git add -f static/releases/gastro-spectra-v29.0.0.apk \
                     static/releases/gastro-spectra-v29.0.0.apk.sha256 \
                     static/releases/build-info.json
          if git diff --cached --quiet; then
            echo "::notice::APK bytes unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "ci: bundle GASTRO-SPECTRA v29.0.0 APK [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
